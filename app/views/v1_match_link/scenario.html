{% extends "layouts/main.html" %}

{% block pageTitle %}
 – {{ serviceName }} – GOV.UK Prototype Kit
{% endblock %}

{% block content %}



  <div class="govuk-grid-row">
    <div class="govuk-grid-column-full">

      <form action="{{currentUrl}}" method="post">

        <div class="govuk-form-group">
          <fieldset class="govuk-fieldset">
            <legend class="govuk-fieldset__legend govuk-fieldset__legend--l">
              <h1 class="govuk-fieldset__heading">
                Scenarios
              </h1>
            </legend>

            <div class="govuk-radios" data-module="govuk-radios">
              <div class="govuk-radios__item">
                <input class="govuk-radios__input" id="scenarios" name="scenarios" type="radio" value="happy">
                <label class="govuk-label govuk-radios__label" for="scenarios">
                  Happy path - no duplications
                </label>
              </div>

              <div class="govuk-radios__item">
                <input class="govuk-radios__input" id="scenarios" name="scenarios" type="radio" value="dup_email">
                <label class="govuk-label govuk-radios__label" for="scenarios">
                  Duplicate email only
                </label>
              </div>

              <div class="govuk-radios__item">
                <input class="govuk-radios__input" id="scenarios" name="scenarios" type="radio" value="dup_identity">
                <label class="govuk-label govuk-radios__label" for="scenarios">
                  Duplicate identity data only
                </label>
              </div>

              <div class="govuk-radios__item">
                <input class="govuk-radios__input" id="scenarios" name="scenarios" type="radio" value="dup_identity_docs">
                <label class="govuk-label govuk-radios__label" for="scenarios">
                  Duplicate identity data and duplicate documentation
                </label>
              </div>

            </div>
          </fieldset>
        </div>

        {{ govukButton({
          text: "Continue"
        }) }}

      </form>

    </div>
  </div>





{% endblock %}
